name: Refresh listings & deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */4 * * *'   # every 4 hours
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build TV listings (keeps the committed snapshot if scraping fails)
        run: |
          cp data/listings.json /tmp/listings.seed.json || true
          node scripts/build-data.mjs || cp /tmp/listings.seed.json data/listings.json
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp index.html app.js rules.js style.css _site/
          cp data/listings.json _site/data/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
